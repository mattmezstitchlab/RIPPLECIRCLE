name: RIPPLECIRCLE — Recette visuelle responsive
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: responsive-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots-and-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium
      - name: Vérifier tailles et captures
        run: node scripts/visual-review.mjs
      - name: Conserver les captures et mesures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ripple-responsive-qa
          path: artifacts/visual-review/
          retention-days: 7
