name: RIPPLECIRCLE 2D — Vérifications
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Installer depuis package-lock.json
        run: npm ci
      - name: Tests Vitest
        run: npm test
      - name: Vérifier les types TypeScript
        run: npx tsc --noEmit
      - name: Compiler pour production
        run: npm run build
